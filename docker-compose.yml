services:
  mongodb:
    image: mongo:7
    container_name: crm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: crm
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: crm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    profiles: ["kafka"]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: crm-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: ["CMD-SHELL", "/etc/confluent/docker/healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5
    profiles: ["kafka"]

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    profiles: ["tools"]

  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/crm
      - JWT_SECRET=${JWT_SECRET:-local-development-secret-change-me}
      - KAFKA_ENABLED=false
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@crm.local}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-AdminDemo123!}
      - SEED_SALES_EMAIL=${SEED_SALES_EMAIL:-sales@crm.local}
      - SEED_SALES_PASSWORD=${SEED_SALES_PASSWORD:-SalesDemo123!}
    command: npm run seed
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: crm-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/crm
      - JWT_SECRET=${JWT_SECRET:-local-development-secret-change-me}
      - JWT_EXPIRES_IN=7d
      - KAFKA_BROKER=kafka:29092
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - CLIENT_URL=http://localhost:5173
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-mistralai/Mistral-7B-Instruct-v0.2}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
    depends_on:
      mongodb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    container_name: crm-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
